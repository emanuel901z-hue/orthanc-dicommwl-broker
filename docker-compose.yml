services:

  # ── Shared Postgres ────────────────────────────────────────────────────────
  # orthanc = index DB (PG plugin), mwl = broker config/log DB.
  # WARNING: dev credentials only — never use these in production.
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: orthanc
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres-init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d orthanc"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # ── Orthanc (PACS/Archiv, Index in Postgres) ───────────────────────────────
  orthanc:
    image: orthancteam/orthanc:latest-full
    restart: unless-stopped
    ports:
      - "8042:8042"
      - "4242:4242"
    environment:
      ORTHANC__NAME: "MWL Broker Orthanc"
      ORTHANC__REMOTE_ACCESS_ALLOWED: "true"
      ORTHANC__AUTHENTICATION_ENABLED: "false"
      ORTHANC__DICOM_MODALITIES_IN_DATABASE: "true"
      ORTHANC__ORTHANC_PEERS_IN_DATABASE: "true"
      ORTHANC__HTTP_HEADERS: '{"Access-Control-Allow-Origin":"*"}'
      ORTHANC__POSTGRESQL__HOST: "postgres"
      ORTHANC__POSTGRESQL__PORT: "5432"
      ORTHANC__POSTGRESQL__DATABASE: "orthanc"
      ORTHANC__POSTGRESQL__USERNAME: "dev"
      ORTHANC__POSTGRESQL__PASSWORD: "dev"
      ORTHANC__POSTGRESQL__ENABLE_INDEX: "true"
      ORTHANC__POSTGRESQL__ENABLE_STORAGE: "false"
      ORTHANC__DICOM_WEB__ENABLE: "true"
      ORTHANC__DICOM_WEB__ROOT: "/dicom-web/"
    volumes:
      - orthanc-data:/var/lib/orthanc/db
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8042/system > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ── MWL Broker ─────────────────────────────────────────────────────────────
  # DICOM SCP on 11113 (AET MWLBROKER): C-FIND MWL proxy + C-STORE router.
  # REST API on 8081 (/api/v1, /metrics, /healthz, /docs).
  mwl-broker:
    build: ./mwl-broker
    restart: unless-stopped
    ports:
      - "8081:8081"
      - "11113:11113"
    environment:
      BROKER_DATABASE_URL: "postgresql+psycopg://dev:dev@postgres:5432/mwl"
      BROKER_AET: "MWLBROKER"
      BROKER_DICOM_PORT: "11113"
      BROKER_ECHO_INTERVAL_S: "30"
      # Seed: two mock RIS sources + two store targets (orthanc = default).
      # Routing rules are created via UI/API once IDs exist.
      BROKER_SEED_CONFIG_JSON: >-
        [{"kind":"source","name":"ris-a","aet":"RIS_A","host":"mock-ris-a","port":11114,"calling_aet":"MWLBROKER","charset":"ISO_IR 100","priority":10},
         {"kind":"source","name":"ris-b","aet":"RIS_B","host":"mock-ris-b","port":11115,"calling_aet":"MWLBROKER","charset":"ISO_IR 100","priority":20},
         {"kind":"target","name":"orthanc","aet":"ORTHANC","host":"orthanc","port":4242,"is_default":true},
         {"kind":"target","name":"pacs-peer","aet":"PEER","host":"dicom-peer","port":4242,"is_default":false}]
    depends_on:
      postgres:
        condition: service_healthy

  # ── Mock RIS sources (dev only) ────────────────────────────────────────────
  # Simulate two upstream MWL SCPs. Variant "b" contains one duplicate of an
  # item in "a" to exercise broker-side dedupe.
  mock-ris-a:
    build: ./mwl-broker
    command: ["python", "-m", "mwl_broker.mock_ris", "--aet", "RIS_A", "--port", "11114", "--variant", "a"]
    ports:
      - "11114:11114"
    restart: unless-stopped

  mock-ris-b:
    build: ./mwl-broker
    command: ["python", "-m", "mwl_broker.mock_ris", "--aet", "RIS_B", "--port", "11115", "--variant", "b"]
    ports:
      - "11115:11115"
    restart: unless-stopped

  # ── Second PACS (routing demo) ─────────────────────────────────────────────
  dicom-peer:
    image: orthancteam/orthanc:latest
    restart: unless-stopped
    ports:
      - "8043:8042"
      - "4243:4242"
    environment:
      ORTHANC__NAME: "PACS Peer"
      ORTHANC__DICOM_AET: "PEER"
      ORTHANC__REMOTE_ACCESS_ALLOWED: "true"
      ORTHANC__AUTHENTICATION_ENABLED: "false"
    volumes:
      - peer-data:/var/lib/orthanc/db
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8042/system')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ── OE3 UI ─────────────────────────────────────────────────────────────────
  # nginx serves the SPA under /oe3/ and proxies /orthanc-proxy + /broker-api.
  oe3:
    build: ./orthanc-explorer-3-usable
    restart: unless-stopped
    ports:
      - "8082:80"
    volumes:
      - ./deploy/oe3-stack.nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/oe3-config.js:/usr/share/nginx/html/config.js:ro
    depends_on:
      orthanc:
        condition: service_healthy
      mwl-broker:
        condition: service_started

volumes:
  pgdata:
  orthanc-data:
  peer-data:
