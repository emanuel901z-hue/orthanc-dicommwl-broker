# mwl-broker stack — production-capable base.
# All host-facing ports/bindings come from .env (see .env.example).
# Demo services (mock RIS sources, second PACS) live in
# docker-compose.demo.yml — enable with:
#   docker compose -f docker-compose.yml -f docker-compose.demo.yml up -d
services:

  # ── Shared Postgres ────────────────────────────────────────────────────────
  # orthanc = index DB (PG plugin), mwl = broker config/log DB.
  # NOT exposed to the host — internal compose network only.
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: orthanc
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres-init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d orthanc"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # ── Orthanc (PACS/Archiv, Index in Postgres) ───────────────────────────────
  orthanc:
    image: orthancteam/orthanc:latest-full
    restart: unless-stopped
    ports:
      - "${ORTHANC_HTTP_BIND:-127.0.0.1}:${ORTHANC_HTTP_PORT}:8042"
      - "${ORTHANC_DICOM_PORT}:4242"
    environment:
      # Secrets/credentials via env — static config lives in orthanc.json
      ORTHANC__POSTGRESQL__USERNAME: ${POSTGRES_USER}
      ORTHANC__POSTGRESQL__PASSWORD: ${POSTGRES_PASSWORD}
      ORTHANC__NAME: ${ORTHANC_NAME}
      ORTHANC__DICOM_AET: ${ORTHANC_AET}
    volumes:
      - orthanc-data:/var/lib/orthanc/db
      - ./deploy/orthanc/orthanc.json:/etc/orthanc/orthanc.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8042/system > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

  # ── MWL Broker ─────────────────────────────────────────────────────────────
  # DICOM SCP on BROKER_DICOM_PORT (AET BROKER_AET): C-FIND MWL proxy +
  # C-STORE router. REST API on BROKER_API_PORT (/api/v1, /metrics, /healthz).
  mwl-broker:
    build: ./mwl-broker
    restart: unless-stopped
    ports:
      - "${BROKER_API_BIND:-127.0.0.1}:${BROKER_API_PORT}:8081"
      - "${BROKER_DICOM_PORT}:11113"
    environment:
      BROKER_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/mwl
      BROKER_AET: ${BROKER_AET}
      BROKER_DICOM_PORT: "11113"
      BROKER_ECHO_INTERVAL_S: ${BROKER_ECHO_INTERVAL_S}
      BROKER_UPSTREAM_TIMEOUT_S: ${BROKER_UPSTREAM_TIMEOUT_S}
      BROKER_ALLOWED_CALLING_AETS: ${BROKER_ALLOWED_CALLING_AETS}
      BROKER_STRICT_STORE_STATUS: ${BROKER_STRICT_STORE_STATUS}
      BROKER_SEEN_ITEM_TTL_DAYS: ${BROKER_SEEN_ITEM_TTL_DAYS}
      BROKER_SEED_CONFIG_JSON: ${BROKER_SEED_CONFIG_JSON}
      BROKER_SPOOL_DIR: ${BROKER_SPOOL_DIR:-/var/lib/mwl-broker/spool}
      BROKER_SPOOL_MAX_ITEMS: ${BROKER_SPOOL_MAX_ITEMS:-20000}
      BROKER_SPOOL_MAX_BYTES: ${BROKER_SPOOL_MAX_BYTES:-10737418240}
      BROKER_SPOOL_MAX_ATTEMPTS: ${BROKER_SPOOL_MAX_ATTEMPTS:-10}
      BROKER_SPOOL_BACKOFF_S: ${BROKER_SPOOL_BACKOFF_S:-60}
      BROKER_SPOOL_RETENTION_S: ${BROKER_SPOOL_RETENTION_S:-86400}
      BROKER_SPOOL_POLL_S: ${BROKER_SPOOL_POLL_S:-10}
      BROKER_CACHE_STALE_MAX_S: ${BROKER_CACHE_STALE_MAX_S:-120}
    volumes:
      # store and forward: undeliverable instances survive a PACS outage and a
      # container restart — keep this on real storage with enough headroom
      - mwl-spool:/var/lib/mwl-broker/spool
    extra_hosts:
      # lets the broker reach services on the host (e.g. a webhook receiver)
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      orthanc:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8081/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # ── OE3 UI ─────────────────────────────────────────────────────────────────
  # nginx serves the SPA under /oe3/ and proxies /orthanc-proxy + /broker-api.
  oe3:
    build: ./orthanc-explorer-3-usable
    restart: unless-stopped
    ports:
      - "${OE3_PORT}:80"
    volumes:
      - ./deploy/oe3-stack.nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/oe3-config.js:/usr/share/nginx/html/config.js:ro
    depends_on:
      orthanc:
        condition: service_healthy
      mwl-broker:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  # ── OHIF viewer (optional: --profile viewer) ───────────────────────────────
  # Hardened OHIF v3.12.5 build (ohif-viewer/Dockerfile) with the custom
  # extension-radiology-advanced panels. The build context is the repo root
  # because the Dockerfile also copies extension-radiology-advanced/.
  #
  # The browser loads the viewer through the OE3 nginx under /ohif/, so OE3's
  # "Open in OHIF" button works same-origin; DICOMweb comes from the bundled
  # Orthanc via /orthanc-proxy/dicom-web.
  #
  #   docker compose --profile viewer up -d --build ohif
  ohif:
    build:
      context: .
      dockerfile: ohif-viewer/Dockerfile
    restart: unless-stopped
    profiles: ["viewer"]
    ports:
      # Direct access for debugging only — OE3 uses the nginx proxy.
      - "${OHIF_BIND:-127.0.0.1}:${OHIF_PORT:-18083}:8080"
    volumes:
      # Runtime config, same pattern as deploy/oe3-config.js.
      - ./deploy/ohif-config.js:/usr/share/nginx/html/config/default.js:ro
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

volumes:
  pgdata:
  orthanc-data:
  # store and forward spool: holds undeliverable DICOM instances
  mwl-spool:
