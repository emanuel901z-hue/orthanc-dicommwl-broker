# nginx-Konfiguration fuer den OHIF-Viewer (Container-intern, Port 8080).
#
# Angepasst fuer Pulmopath: DICOMweb geht direkt ueber den Backend-Proxy
# (/api/v1/pacs/orthanc/dicom-web) mit JWT-Auth + Multi-Tenant-Isolation.
# Kein pacs-proxy, keine metadata-bridge, kein accession-resolver noetig.
#
# Der Viewer wird vom pulmopath-nginx unter /ohif/ proxied.
# routerBasename ist /ohif/ (siehe static-config.js).

server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;

    server_tokens off;

    # Security-Header
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 100M;
    client_body_timeout 60s;
    client_header_timeout 60s;

    root /usr/share/nginx/html;
    index index.html;

    absolute_redirect off;

    # Gzip-Kompression fuer Assets
    gzip on;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml text/xml application/wasm;
    gzip_vary on;
    gzip_min_length 256;
    gzip_proxied any;

    # SPA-Fallback: alle nicht gefundenen Pfade auf index.html legen,
    # damit React-Router die Route client-seitig aufloesen kann.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Statische Assets aggressiv cachen (gehashte Dateinamen).
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|wasm)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }
}
