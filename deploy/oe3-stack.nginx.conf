# OE3 nginx config for the workspace stack.
# Serves the SPA under /oe3/ (matches BrowserRouter basename + vite base),
# proxies Orthanc and broker APIs same-origin.
server {
    # conservative security headers for everything this proxy serves (no CSP —
    # the SPA loads dynamic chunks); nginx inherits add_header only downwards,
    # so they belong here and not in a location block
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # Keep relative redirects relative — otherwise nginx rewrites / -> /oe3/
    # against the internal listen port 80 and drops the published host port.
    absolute_redirect off;

    location = / {
        return 302 /oe3/;
    }

    # config.js must not be cached — it contains runtime config
    location = /config.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "same-origin" always;
        # conservative security headers — no CSP, the SPA loads dynamic chunks
        try_files $uri =404;
    }

    # Orthanc REST API
    location /orthanc-proxy/ {
        proxy_pass http://orthanc:8042/;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;
    }

    # MWL broker REST API (+ /metrics if needed)
    location /broker-api/ {
        proxy_pass http://mwl-broker:8081/;
        proxy_set_header Host $host;
    }

    # OHIF viewer — optional, started with `docker compose --profile viewer`.
    # The upstream is resolved per request (docker DNS) so the stack also
    # starts — and nginx stays healthy — when the viewer is not running.
    location /ohif/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $ohif_upstream http://ohif:8080;
        rewrite ^/ohif/(.*)$ /$1 break;
        proxy_pass $ohif_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;
    }

    # SPA under /oe3/ — strip prefix, fall back to index.html
    location /oe3/ {
        rewrite ^/oe3/(.*)$ /$1 break;
        try_files $uri $uri/ /index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }
}
