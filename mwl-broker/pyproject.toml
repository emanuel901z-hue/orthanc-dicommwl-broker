[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mwl-broker"
version = "1.0.0"
description = "DICOM Modality Worklist broker: C-FIND proxy/aggregator + C-STORE router for Orthanc"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pynetdicom>=2.1",
    "pydicom>=2.4",
    "SQLAlchemy>=2.0",
    "alembic>=1.13",
    # DICOM TLS (pynetdicom's TLS support) and the certificate handling
    "cryptography>=42,<51",
    "psycopg[binary]>=3.1",
    "pydantic-settings>=2.4",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
include = ["mwl_broker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
